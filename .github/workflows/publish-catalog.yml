name: Publish Generated Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'blocked/**'
      - 'deprecated/**'
      - 'schemas/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish generated Kitchen catalog"
          file_pattern: catalog/index.json
